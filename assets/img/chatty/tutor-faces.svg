    <!-- Illustrative screen icon; deliberately not a scannable guest token. -->
    <g fill="#dbf7ff" shape-rendering="crispEdges" transform="translate(24 24) scale(2)">
      <path fill-rule="evenodd" d="M0 0h5v5H0zM1 1v3h3V1zM8 0h5v5H8zM9 1v3h3V1zM0 8h5v5H0zM1 9v3h3V9z"/>
      <path d="M2 2h1v1H2zM10 2h1v1h-1zM2 10h1v1H2zM6 0h1v3H6zM6 4h1v3H6zM0 6h3v1H0zM4 6h1v1H4zM8 6h3v1H8zM12 6h1v3h-1zM6 8h3v1H6zM10 8h1v3h-1zM6 10h1v3H6zM8 10h1v1H8zM8 12h3v1H8zM12 11h1v2h-1z"/>
    </g>
  </symbol>
  <symbol id="guest" viewBox="0 0 40 40">
    <g shape-rendering="crispEdges">
      <path fill="#0d5bd9" d="M14 4h12v4h4v12h-4v4h6v4h4v8H4v-8h4v-4h6v-4h-4V8h4z"/>
      <path fill="#ffdb9c" d="M14 8h12v12H14z"/>
      <path fill="#5eb0fe" d="M12 28h16v4h4v4H8v-4h4z"/>
      <path fill="#d0ecfc" d="M16 24h8v4h-8z"/>
