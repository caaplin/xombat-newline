  <symbol id="focus" viewBox="0 0 76 64"><use href="#shell"/><path fill="#0d5bd9" shape-rendering="crispEdges" transform="translate(8 20) scale(4)" d="M4 2h1v2H4zM10 2h1v2h-1zM5 6h5v1H5z"/></symbol>
  <symbol id="sad" viewBox="0 0 76 64"><use href="#shell"/><path fill="#0d5bd9" shape-rendering="crispEdges" transform="translate(8 20) scale(4)" d="M4 2h1v1H4zM10 2h1v1h-1zM5 5h5v1H5zM4 6h1v1H4zM10 6h1v1h-1z"/></symbol>
  <symbol id="tired" viewBox="0 0 76 64"><use href="#shell"/><path fill="#0d5bd9" shape-rendering="crispEdges" transform="translate(8 20) scale(4)" d="M3 3h3v1H3zM9 3h3v1H9zM6 6h3v1H6z"/></symbol>
