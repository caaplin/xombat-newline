<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Face proportions follow the Chatty editor's 15 × 8 grid.
       The smile matches the existing Guest smile reference screenshot. -->
  <defs>
    <g id="shell" shape-rendering="crispEdges">
      <path fill="#0d5bd9" d="M8 4h12v4h4v8h28V8h4V4h12v4h4v12h4v36h-4v4H4v-4H0V20h4V8h4z"/>
      <path fill="#ff7254" d="M8 8h8v4h4v8h36v-8h4V8h8v16h4v28h-4v4H8v-4H4V24h4z"/>
      <path fill="#ffb59b" d="M8 24h60v4H8zM8 28h4v20H8zM8 8h8v4H8zM60 8h8v4h-8z"/>
      <path fill="#b73e33" d="M12 48h52v4H12zM64 28h4v20h-4zM12 12h4v4h-4zM60 12h4v4h-4z"/>
      <path fill="#c6efff" d="M12 20h52v4h4v24h-4v4H12v-4H8V24h4z"/>
    </g>
  </defs>
  <symbol id="smile" viewBox="0 0 76 64">
    <use href="#shell"/>
    <g fill="#0d5bd9" shape-rendering="crispEdges" transform="translate(8 20) scale(4)">
      <path d="M4 2h1v2H4zM10 2h1v2h-1zM3 5h1v1H3zM4 6h7v1H4zM11 5h1v1h-1z"/>
    </g>
  </symbol>
  <symbol id="talk" viewBox="0 0 76 64">
    <use href="#shell"/>
    <g fill="#0d5bd9" shape-rendering="crispEdges" transform="translate(8 20) scale(4)">
      <path d="M4 2h1v2H4zM10 2h1v2h-1zM5 5h5v1H5zM5 6h1v1H5zM9 6h1v1H9zM6 7h3v1H6z"/>
    </g>
  </symbol>
  <symbol id="qr" viewBox="0 0 76 64">
